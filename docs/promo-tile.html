<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>promo tile</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: #fbfaf8;
        color: #1c1b19;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 40px;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      img { width: 104px; height: 104px; flex: none; }
      h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.02em; line-height: 1.1; }
      p { margin: 0; color: #6d6a64; font-size: 15px; line-height: 1.35; }
      .rule { height: 3px; width: 44px; background: #b8420f; border-radius: 2px; margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <img src="../icons/icon128.png" alt="" />
    <div>
      <h1>Read Your Sheet</h1>
      <p>Blocks the distracting sites<br />until your reading pile shrinks.</p>
      <div class="rule"></div>
    </div>
  </body>
</html>
