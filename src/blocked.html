<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Read your sheet</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body { display: flex; justify-content: center; padding: 8vh 24px 60px; }
      main { width: 100%; max-width: 560px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Read your sheet.</h1>
      <p class="lede" id="lede"></p>

      <div class="stats" id="stats"></div>

      <section id="here-wrap" hidden>
        <h2 id="here-title"></h2>
        <div class="card"><ul class="items" id="here"></ul></div>
      </section>

      <section id="other-wrap" hidden>
        <h2>Or clear one of these</h2>
        <div class="card"><ul class="items" id="other"></ul></div>
      </section>

      <div class="spacer"></div>
      <div class="row">
        <button id="continue" class="primary" disabled></button>
        <button id="options">Settings</button>
      </div>
      <p class="small muted" style="margin-top: 12px" id="footnote"></p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
